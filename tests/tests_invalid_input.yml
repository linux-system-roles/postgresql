# SPDX-License-Identifier: MIT
---
- name: Verify invalid parameters are rejected
  hosts: all
  tasks:
    - name: Run invalid input tests
      block:
        - name: Run role with valid defaults
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Run argument specs validation tests
          when: ansible_version.full is version('2.11', '>=')
          block:
            - name: Argument specs reject missing required ca in postgresql_certificates
              block:
                - name: Run role without required ca in postgresql_certificates
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    postgresql_certificates:
                      - name: test_cert
              rescue:
                - name: Mark missing ca rejected
                  ansible.builtin.set_fact:
                    __invalid_input_missing_ca_failed: true
                  when: >-
                    'missing required arguments' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert missing ca was rejected
              ansible.builtin.assert:
                that:
                  - __invalid_input_missing_ca_failed | default(false)
                fail_msg: >-
                  argument_specs should reject postgresql_certificates
                  entries missing the required ca field

            - name: Argument specs reject non-boolean postgresql_ssl_enable
              block:
                - name: Run role with non-boolean postgresql_ssl_enable
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    postgresql_ssl_enable: not_a_bool
              rescue:
                - name: Mark invalid postgresql_ssl_enable type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_ssl_enable_type_failed: true
                  when: >-
                    'postgresql_ssl_enable' in
                    (ansible_failed_result | default({}) | to_json)
                    and 'bool' in
                    (ansible_failed_result | default({}) | to_json | lower)

            - name: Assert invalid postgresql_ssl_enable type was rejected
              ansible.builtin.assert:
                that:
                  - __invalid_input_ssl_enable_type_failed | default(false)
                fail_msg: >-
                  argument_specs should reject postgresql_ssl_enable
                  with a non-boolean value

            - name: Argument specs reject non-boolean postgresql_secure_logging
              block:
                - name: Run role with non-boolean postgresql_secure_logging
                  ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
                  vars:
                    postgresql_secure_logging: not_a_bool
              rescue:
                - name: Mark invalid postgresql_secure_logging type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_secure_logging_type_failed: true
                  when: >-
                    'postgresql_secure_logging' in
                    (ansible_failed_result | default({}) | to_json)
                    and 'bool' in
                    (ansible_failed_result | default({}) | to_json | lower)

            - name: Assert invalid postgresql_secure_logging type was rejected
              ansible.builtin.assert:
                that:
                  - __invalid_input_secure_logging_type_failed | default(false)
                fail_msg: >-
                  argument_specs should reject postgresql_secure_logging
                  with a non-boolean value

        - name: Assert rejects postgresql_version as a dict
          block:
            - name: Run role with postgresql_version as a dict
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                postgresql_version:
                  major: 13
          rescue:
            - name: Mark postgresql_version dict rejected
              ansible.builtin.set_fact:
                __invalid_input_version_dict_failed: true
              when: >-
                'postgresql_version must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert postgresql_version as dict was rejected
          ansible.builtin.assert:
            that:
              - __invalid_input_version_dict_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject postgresql_version when
              given a dictionary value

        - name: Assert rejects postgresql_password as an integer
          block:
            - name: Run role with postgresql_password as an integer
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                postgresql_password: 12345
          rescue:
            - name: Mark postgresql_password integer rejected
              ansible.builtin.set_fact:
                __invalid_input_password_int_failed: true
              when: >-
                'postgresql_password must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert postgresql_password as integer was rejected
          ansible.builtin.assert:
            that:
              - __invalid_input_password_int_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject postgresql_password when
              given an integer value

        - name: Assert rejects postgresql_cert_name as an integer
          block:
            - name: Run role with postgresql_cert_name as an integer
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                postgresql_cert_name: 42
          rescue:
            - name: Mark postgresql_cert_name integer rejected
              ansible.builtin.set_fact:
                __invalid_input_cert_name_int_failed: true
              when: >-
                'postgresql_cert_name must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert postgresql_cert_name as integer was rejected
          ansible.builtin.assert:
            that:
              - __invalid_input_cert_name_int_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject postgresql_cert_name when
              given an integer value

        - name: Assert rejects postgresql_server_tuning as an integer
          block:
            - name: Run role with postgresql_server_tuning as an integer
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                postgresql_server_tuning: 123
          rescue:
            - name: Mark postgresql_server_tuning integer rejected
              ansible.builtin.set_fact:
                __invalid_input_server_tuning_int_failed: true
              when: >-
                'postgresql_server_tuning must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert postgresql_server_tuning as integer was rejected
          ansible.builtin.assert:
            that:
              - __invalid_input_server_tuning_int_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject postgresql_server_tuning
              when given an integer value

        - name: Assert rejects postgresql_certificates dns as an integer
          block:
            - name: Run role with postgresql_certificates dns as an integer
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                postgresql_certificates:
                  - name: test_cert
                    ca: self-sign
                    dns: 123
          rescue:
            - name: Mark postgresql_certificates dns integer rejected
              ansible.builtin.set_fact:
                __invalid_input_cert_dns_int_failed: true
              when: >-
                'postgresql_certificates' in
                (ansible_failed_result | default({}) | to_json)
                and '.dns must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert postgresql_certificates dns as integer was rejected
          ansible.builtin.assert:
            that:
              - __invalid_input_cert_dns_int_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject postgresql_certificates
              entries where dns is an integer

      always:
        - name: Clear test facts
          ansible.builtin.set_fact:
            __invalid_input_missing_ca_failed:
            __invalid_input_ssl_enable_type_failed:
            __invalid_input_secure_logging_type_failed:
            __invalid_input_version_dict_failed:
            __invalid_input_password_int_failed:
            __invalid_input_cert_name_int_failed:
            __invalid_input_server_tuning_int_failed:
            __invalid_input_cert_dns_int_failed:
          tags: tests::cleanup
