---
# Put the tasks for your role here.

- name: Set platform/version specific variables
  include_tasks: tasks/set_vars.yml

- name: Validate role parameters
  ansible.builtin.include_tasks: assert_role_vars.yml

- name: Gather the package facts
  package_facts:
  no_log: "{{ ansible_verbosity < 3 }}"

- name: Check if requested version is supported in the system (RHEL8)
  fail:
    msg: RHEL 8 supports only Postgresql 10, 12, 13, 15 and 16
  when:
    - ansible_facts["os_family"] == "RedHat"
    - ansible_facts["distribution_major_version"] == "8"
    - __postgresql_version | string not in __postgresql_versions_el8

- name: Check if requested version is supported in system (RHEL9)
  fail:
    msg: RHEL 9 supports only Postgresql 13, 15, 16 and 18
  when:
    - ansible_facts["os_family"] == "RedHat"
    - ansible_facts["distribution_major_version"] == "9"
    - __postgresql_version | string not in __postgresql_versions_el9

- name: Check if requested version is supported in system (RHEL10)
  fail:
    msg: >-
      RHEL 10 supports only Postgresql versions
      {{ __postgresql_versions_el10 | join(",") }}
  when:
    - ansible_facts["os_family"] == "RedHat"
    - ansible_facts["distribution_major_version"] == "10"
    - __postgresql_version | string not in __postgresql_versions_el10

- name: Check requested and installed version of Postgresql
  fail:
    msg: >-
      Setting version {{ __postgresql_version }} while
      {{ __installed_versions | join(', ') }} is installed
  when:
    - __installed_versions | length > 0
    - __installed_versions != [__postgresql_version | string]
  vars:
    __installed_versions: "{{ ansible_facts.packages | dict2items |
      selectattr('key', 'match', __postgresql_version_packages) |
      map(attribute='value') | flatten | map(attribute='version') |
      map('regex_search', '^([0-9]+)', '\\1') | map('first') | unique | list }}"

# rpm ostree pkg mgr cannot handle @groups/modules
# so just assume the packages are present
- name: Ensure required packages are installed
  package:
    name: "{{ __actual_packages }}"
    state: present
    use: "{{ (__postgresql_is_ostree | d(false)) |
             ternary('ansible.posix.rhel_rpm_ostree', omit) }}"
  when: __actual_packages | length > 0
  vars:
    __actual_packages: "{{
      (__postgresql_is_ostree | d(false)) |
      ternary(__postgresql_packages | reject('match', '^@'),
              __postgresql_packages) | list }}"
  register: __postgresql_package_result

# A staged install reports ok on re-runs, so ask rpm (by provides) if it is live.
- name: Check whether the packages are live on a transactional update system
  command:  # noqa command-instead-of-module
    argv: "{{ ['rpm', '-q', '--whatprovides'] + __postgresql_packages }}"
  register: __postgresql_packages_live
  changed_when: false
  failed_when: false
  check_mode: false
  when: __postgresql_is_transactional | d(false)

- name: Handle reboot for transactional update systems
  when:
    - __postgresql_is_transactional | d(false)
    - __postgresql_package_result is changed or
      (__postgresql_packages_live.rc | d(0)) != 0
  block:
    - name: Notify user that reboot is needed to apply changes
      debug:
        msg: >
          Reboot required to apply changes due to transactional updates.

    - name: Reboot transactional update systems
      reboot:
        msg: Rebooting the system to apply transactional update changes.
      when:
        - postgresql_transactional_update_reboot_ok is not none
        - postgresql_transactional_update_reboot_ok | bool

    - name: Fail if reboot is needed and not set
      fail:
        msg: >
          Reboot is required but not allowed. Please set 'postgresql_transactional_update_reboot_ok' to proceed.
      when:
        - postgresql_transactional_update_reboot_ok is none

- name: Init DB on booted systems (with postgresql-setup)
  when:
    - not __postgresql_conf.stat.exists
    - __postgresql_is_booted | bool
    - __postgresql_has_setup_cmd | bool
  command:
    cmd: postgresql-setup --initdb
    creates: "{{ __postgresql_main_conf_file }}"

- name: Init DB on booted systems (without postgresql-setup)
  when:
    - not __postgresql_conf.stat.exists
    - __postgresql_is_booted | bool
    - not __postgresql_has_setup_cmd | bool
  become: true
  become_user: postgres
  command:
    cmd: "initdb -D {{ __postgresql_data_dir }}"
    creates: "{{ __postgresql_main_conf_file }}"

# this is tricky: postgresql-setup calls `systemctl` to query the unit file and
# state, but that doesn't work in container build environments; so patch them
# out and replace with static values
- name: Init DB on non-booted systems (with postgresql-setup)
  when:
    - not __postgresql_conf.stat.exists
    - not __postgresql_is_booted | bool
    - __postgresql_has_setup_cmd | bool
  shell:
    cmd: |
      set -euo pipefail
      setup=$(mktemp --suffix=-pgsetup)
      sed -r 's@systemctl show -p ([[:alnum:]]+) ".*service"@grep ^\1= /usr/lib/systemd/system/postgresql.service@;
              s/systemctl show -p \$nr_option.*service/echo NeedDaemonReload=no/' \
          /usr/bin/postgresql-setup > $setup
      chmod a+rx $setup
      $setup --initdb
      rm $setup
    creates: "{{ __postgresql_main_conf_file }}"

- name: Init DB on non-booted systems (without postgresql-setup)
  when:
    - not __postgresql_conf.stat.exists
    - not __postgresql_is_booted | bool
    - not __postgresql_has_setup_cmd | bool
  become: true
  become_user: postgres
  command:
    cmd: "initdb -D {{ __postgresql_data_dir }}"
    creates: "{{ __postgresql_main_conf_file }}"

- name: Enable and start existing instance of postgresql server
  service:
    name: postgresql
    state: "{{ 'started' if __postgresql_is_booted else omit }}"
    enabled: true

- name: Set and enable password
  when: postgresql_password is not none
  block:
    - name: Fail on non-booted hosts
      fail:
        msg: "postgresql_password option is only supported on booted hosts, not container builds"
      when: not  __postgresql_is_booted | bool

    - name: Set password for super user
      become: true
      become_user: postgres
      environment:
        PGPASSWORD: "{{ postgresql_password }}"
      command:
        cmd: >
          psql -c "ALTER USER postgres WITH ENCRYPTED PASSWORD
          '{{ postgresql_password }}';"
      no_log: "{{ postgresql_secure_logging }}"
      changed_when: false

    - name: Enable logging in by password
      replace:
        path: "{{ __postgresql_hba_conf_file }}"
        regexp: "(peer|ident)$"
        replace: "md5"
        backup: true
      notify: Restart postgresql

- name: Fail input_file on non-booted hosts
  fail:
    msg: "postgresql_input_file option is only supported on booted hosts, not container builds"
  when:
    - not  __postgresql_is_booted | bool
    - postgresql_input_file is defined

- name: Run provided SQL script
  include_tasks: input_sql_file.yml
  when: postgresql_input_file is defined

- name: Manage certificates
  include_tasks: certificate.yml

- name: Configure pg_hba.conf
  become: true
  template:
    backup: true
    dest: "{{ __postgresql_hba_conf_file }}"
    src: pg_hba.conf.j2
    mode: "0600"
    owner: postgres
    group: postgres
  when: postgresql_pg_hba_conf is defined
  notify: Restart postgresql

- name: Create postgresql directory in /etc
  file:
    path: /etc/postgresql
    state: directory
    mode: "0755"

- name: Link generated conf file with server one
  lineinfile:
    path: "{{ __postgresql_main_conf_file }}"
    line: "include_if_exists = '{{ __postgresql_internal_conf_file }}'"
    insertafter: "EOF"
  notify: Restart postgresql

- name: Generate postgresql system-roles-internal.conf
  become: true
  template:
    backup: true
    dest: "{{ __postgresql_internal_conf_file }}"
    src: postgresql-internal.conf.j2
    mode: "0600"
    owner: postgres
    group: postgres

- name: Generate postgresql system-roles.conf
  when: postgresql_server_conf is defined
  block:
    - name: Generate postgresql system-roles.conf
      become: true
      template:
        backup: true
        dest: "{{ __postgresql_conf_file }}"
        src: postgresql.conf.j2
        mode: "0600"
        owner: postgres
        group: postgres

    - name: Link generated conf file with server one
      lineinfile:
        path: "{{ __postgresql_main_conf_file }}"
        line: "include_if_exists = '{{ __postgresql_conf_file }}'"
      notify: Restart postgresql

- name: Record role success fingerprint
  sr_fingerprint:
    status: success
    role_name: postgresql
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __postgresql_write_log_file }}"
